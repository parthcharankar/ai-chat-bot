<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Node HTML Server</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        align-items: center;
        background: #f4f7fb;
        color: #172033;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: white;
        border: 1px solid #dce3ef;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgb(23 32 51 / 10%);
        max-width: 560px;
        padding: 3rem;
        text-align: center;
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #526078;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Node.js</h1>
      <p>Your server is running and serving this HTML page.</p>
    </main>
  </body>
</html>
